<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d0d">
  <meta name="description" content="Oyunculu gösterim bilet bağlantıları.">
  <title>Oyunculu Gösterim</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #fff8ed;
      --muted: #d2c9bd;
      --gold: #f0bd74;
      --line: rgba(255, 248, 237, .2);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--cream);
      background-color: #100d0d;
      background-image:
        linear-gradient(180deg, rgba(10, 8, 8, .55) 0%, rgba(10, 8, 8, .78) 40%, rgba(10, 8, 8, .94) 100%),
        url("./cinema-seats-bg.jpg");
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      font-family: Inter, Aptos, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    main { width: min(640px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 72px; }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 720;
      letter-spacing: -.05em;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 3px 28px rgba(0, 0, 0, .55);
    }

    h1 span { color: var(--gold); }

    .hero {
      position: relative;
      margin: 0 0 22px;
      overflow: hidden;
      border: 1px solid rgba(240, 189, 116, .45);
      border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .4);
      background: #1a1411;
    }
    .hero img { display: block; width: 100%; height: auto; aspect-ratio: 1350 / 700; object-fit: cover; }
    .hero figcaption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 48px 18px 16px;
      background: linear-gradient(180deg, rgba(10, 8, 8, 0) 0%, rgba(10, 8, 8, .82) 70%);
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold);
      color: #1c120b;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .hero-tag::before { width: 6px; height: 6px; border-radius: 50%; background: #c0392b; box-shadow: 0 0 0 3px rgba(192, 57, 43, .25); content: ""; }
    .hero-text { display: block; color: #fff8ed; font-size: 17px; font-weight: 750; line-height: 1.35; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }

    .links { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }

    .links a,
    .links .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px 12px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(17, 14, 14, .8);
      backdrop-filter: blur(8px);
      color: inherit;
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .links a:hover { border-color: rgba(240, 189, 116, .8); background: rgba(30, 22, 18, .9); transform: translateY(-1px); }
    .links a:focus-visible { outline: 3px solid #ffe1b5; outline-offset: 3px; }

    .date {
      display: grid;
      flex: 0 0 auto;
      width: 76px;
      place-items: center;
      align-content: center;
      align-self: stretch;
      padding: 8px 4px;
      border-radius: 8px;
      background: var(--gold);
      color: #1c120b;
      line-height: 1;
      text-align: center;
    }
    .day { font-size: 32px; font-weight: 850; letter-spacing: -.04em; }
    .month { margin-top: 4px; font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .weekday { margin-top: 3px; font-size: 11px; font-weight: 700; opacity: .8; }

    .info { display: grid; flex: 1 1 auto; gap: 3px; min-width: 0; }
    .time { color: var(--gold); font-size: 18px; font-weight: 850; letter-spacing: .02em; }
    .venue { font-size: 16px; font-weight: 650; }
    .soon .cta { border-style: dashed; color: var(--muted); cursor: default; }
    .note { margin-top: 4px; padding: 6px 9px; border-left: 3px solid var(--gold); border-radius: 4px; background: rgba(240, 189, 116, .12); color: #ffe7c4; font-size: 13px; font-weight: 600; line-height: 1.4; }

    .imdb {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 28px;
      padding: 18px;
      border: 1px solid rgba(245, 197, 24, .55);
      border-radius: 12px;
      background: rgba(17, 14, 14, .85);
      backdrop-filter: blur(8px);
      color: inherit;
      text-decoration: none;
      transition: border-color .2s ease, transform .2s ease;
    }
    .imdb:hover { border-color: #f5c518; transform: translateY(-1px); }
    .imdb:focus-visible { outline: 3px solid #ffe1b5; outline-offset: 3px; }
    .imdb-logo {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 6px;
      background: #f5c518;
      color: #000;
      font-family: Impact, "Arial Black", "Helvetica Neue", Arial, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1;
    }
    .imdb-text { display: grid; flex: 1 1 auto; gap: 3px; min-width: 0; }
    .imdb-title { font-size: 17px; font-weight: 800; }
    .imdb-sub { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .imdb-stars { color: #f5c518; letter-spacing: .12em; }
    .imdb-cta {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 6px;
      background: #f5c518;
      color: #000;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .cta {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(240, 189, 116, .72);
      border-radius: 6px;
      color: #ffdbab;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .links a:hover .cta { background: var(--gold); color: #24170e; }

    @media (max-width: 480px) {
      main { padding-top: 40px; }
      .links a { gap: 12px; padding: 10px 12px 10px 10px; }
      .date { width: 68px; }
      .weekday { font-size: 10px; }
      .day { font-size: 28px; }
      .cta { padding: 8px 9px; }
      .venue { font-size: 15px; }
      .hero figcaption { position: static; padding: 12px 14px 14px; background: linear-gradient(180deg, rgba(40, 28, 20, .95), rgba(17, 14, 14, .95)); }
      .hero-text { font-size: 15px; }
      .imdb { flex-wrap: wrap; gap: 12px; padding: 14px; }
      .imdb-text { flex-basis: calc(100% - 90px); }
      .imdb-cta { width: 100%; padding: 11px; text-align: center; font-size: 14px; }
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Oyunculu <span>Gösterim</span></h1>

    <figure class="hero">
      <img src="./oyuncular.jpg" width="720" height="373" alt="Mahsun Karaca ve Murat Onur Öner, Ben Sana İnanıyorum filminden bir sahnede">
      <figcaption>
        <span class="hero-tag">Salonlardayız</span>
        <span class="hero-text">Mahsun Karaca ve Murat Onur Öner oyunculu gösterimlerde seyirciyle buluşuyor.</span>
      </figcaption>
    </figure>

    <ul class="links">
      <li><a href="https://www.biletiva.com/place/ADANA_01BURDA_CINEMAPINK" target="_blank" rel="noopener noreferrer">
        <span class="date"><span class="day">21</span><span class="month">Kasım</span><span class="weekday">Cumartesi</span></span><span class="info"><span class="time">16:15</span><span class="venue">Adana 01 Burda AVM CinemaPink</span></span><span class="cta">Bilet al ↗</span></a></li>
      <li><a href="https://biletinial.com/tr-tr/WebLogin?seanceId=18916361&amp;organizerType=1&amp;OrganizerTypeUrl=sinema&amp;lang=tr&amp;a_aid=&amp;a_bid=&amp;cinemaId=4&amp;Region=tr-tr&amp;SiteId=0" target="_blank" rel="noopener noreferrer">
        <span class="date"><span class="day">21</span><span class="month">Kasım</span><span class="weekday">Cumartesi</span></span><span class="info"><span class="time">18:45</span><span class="venue">Adana Optimum AVM Avşar Sinemaları</span></span><span class="cta">Bilet al ↗</span></a></li>
    </ul>

    <a class="imdb" href="https://www.imdb.com/title/tt45162733/" target="_blank" rel="noopener noreferrer">
      <span class="imdb-logo" aria-hidden="true">IMDb</span>
      <span class="imdb-text">
        <span class="imdb-title">Filmi izlediniz mi?</span>
        <span class="imdb-sub"><span class="imdb-stars">★★★★★</span><br>IMDb'de puan verin, filmin daha çok kişiye ulaşmasına destek olun.</span>
      </span>
      <span class="imdb-cta">IMDb'de puanla ↗</span>
    </a>
  </main>
</body>
</html>
